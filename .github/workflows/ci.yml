name: CI

on:
  # main on every push; other branches through their pull request, so a
  # PR's push does not start the whole set twice.
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older, unfinished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.cxx }} -march=${{ matrix.march }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        march: [x86-64, haswell, native]
    steps:
      - uses: actions/checkout@v4
      - name: CPU features
        run: grep -o -w -E 'avx2|fma|avx512f|avx512bw|avx512vl|avx512_vnni|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' '
      - name: Build
        run: make CXX=${{ matrix.cxx }} MARCH=${{ matrix.march }} EXTRA=-Werror all research_experiment
      - name: Test
        run: |
          make test
          ./research_experiment --steps 5 --seeds 1 --threads 2 --continual --rl-steps 5 --out runs/ci-smoke.csv

  windows:
    name: Windows clang-cl CPU
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $installation) { throw "No Visual Studio C++ toolchain found" }
          $version = [version]$installation.installationVersion
          $generators = (cmake -E capabilities | ConvertFrom-Json).generators
          $generator = $generators.name | Where-Object { $_ -like "Visual Studio $($version.Major) *" } | Select-Object -First 1
          if (-not $generator) { throw "CMake has no generator for Visual Studio $($version.Major)" }
          cmake -S . -B build -G $generator -T ClangCL -A x64 "-DCMAKE_GENERATOR_INSTANCE=$($installation.installationPath)"
      - name: Build CPU engine and tests
        run: cmake --build build --config Release --parallel
      # -V shows every test's output, including the CPU features and
      # kernels that ternary_moe --tests found on the runner.
      - name: Test
        run: ctest --test-dir build -C Release -V
      # The CLI itself, which ctest does not run: every command answers
      # --help, and a tiny curriculum trains, saves and is evaluated.
      - name: CLI smoke test
        run: |
          $cx = "build\Release\cxxgpt.exe"
          function Run { & $cx @args; if ($LASTEXITCODE -ne 0) { throw "cxxgpt $($args[0]) exited with $LASTEXITCODE" } }
          foreach ($c in 'bpe-train','text2tok','train','sample','gen-reasoning','prep-qa','eval-reasoning','bench-infer') { Run $c --help > $null }
          Run gen-reasoning --out ci\r --train 2000 --val 100 --test-per-cell 2
          Run train --data ci\r.train.tok --val ci\r.val.tok --seq 64 --dim 32 --layers 1 --heads 2 --batch 4 --steps 5 --log-every 5 --out ci\m.ckpt
          Run eval-reasoning --ckpt ci\m.ckpt --test ci\r.test.txt --limit 8 --max-new 20

  # ISA paths the runner may not be able to execute still have to compile.
  compile-only:
    name: compile ${{ matrix.cxx }} -march=${{ matrix.march }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        march: [alderlake, skylake-avx512, icelake-server]
    steps:
      - uses: actions/checkout@v4
      - run: make CXX=${{ matrix.cxx }} MARCH=${{ matrix.march }} EXTRA=-Werror all research_experiment

  sanitizers:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: make ${{ matrix.target }}

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make bench

  # The CUDA backend must compile and link. The runners have no GPU, so its
  # tests (make gpu-test) run on a real one.
  cuda:
    name: CUDA ${{ matrix.cuda }} build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cuda: ['12-8', '13-0']
    steps:
      - uses: actions/checkout@v4
      - name: Install nvcc and cuBLAS
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            cuda-nvcc-${{ matrix.cuda }} cuda-cudart-dev-${{ matrix.cuda }} libcublas-dev-${{ matrix.cuda }}
      - name: Build
        run: |
          CUDA_HOME=/usr/local/cuda-$(echo ${{ matrix.cuda }} | tr - .)
          make gpu NVCC=$CUDA_HOME/bin/nvcc CUDA_HOME=$CUDA_HOME CUDA_ARCH=sm_89 EXTRA=-Werror \
            NVCC_EXTRA="-Werror all-warnings -Xcompiler -Werror"

  # The laptop setup script, minus the steps that need a GPU present.
  setup-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: NO_GPU=1 scripts/setup_wsl.sh

  # The laptop scripts: lint them, and run the GPU probe end to end on the
  # CPU build (a tiny model, a few steps).
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
      - run: python3 -m py_compile scripts/get_data.py scripts/prep_public.py
      - run: make cxxgpt
      - name: every command answers --help
        run: for c in bpe-train text2tok train sample gen-reasoning prep-qa eval-reasoning bench-infer; do ./cxxgpt $c --help > /dev/null; done
      - name: probe.sh on the CPU build
        run: |
          CX=./cxxgpt GPU= SEQ=32 BATCH=4 ACCUM=1 VOCAB=256 \
            SIZES="tiny:--dim 32 --layers 1 --heads 2" scripts/probe.sh 5 | tee probe.out
          grep -q "scripts/night.sh" probe.out

  # The download source, checked against the real server: each file
  # scripts/get_data.py fetches is where it expects it, with the fields it
  # reads. A few KB (byte ranges), no full downloads.
  data-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/get_data.py --check gsm8k
