name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.cxx }} -march=${{ matrix.march }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        march: [x86-64, haswell, native]
    steps:
      - uses: actions/checkout@v4
      - name: CPU features
        run: grep -o -w -E 'avx2|fma|avx512f|avx512bw|avx512vl|avx512_vnni|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' '
      - name: Build
        run: make CXX=${{ matrix.cxx }} MARCH=${{ matrix.march }} EXTRA=-Werror all
      - name: Test
        run: make test

  # ISA paths the runner may not be able to execute still have to compile.
  compile-only:
    name: compile ${{ matrix.cxx }} -march=${{ matrix.march }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        march: [alderlake, skylake-avx512, icelake-server]
    steps:
      - uses: actions/checkout@v4
      - run: make CXX=${{ matrix.cxx }} MARCH=${{ matrix.march }} EXTRA=-Werror all

  sanitizers:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: make ${{ matrix.target }}

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make bench

  # The CUDA backend must compile and link. The runners have no GPU, so its
  # tests (make gpu-test) run on a real one.
  cuda:
    name: CUDA ${{ matrix.cuda }} build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cuda: ['12-8', '13-0']
    steps:
      - uses: actions/checkout@v4
      - name: Install nvcc and cuBLAS
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            cuda-nvcc-${{ matrix.cuda }} cuda-cudart-dev-${{ matrix.cuda }} libcublas-dev-${{ matrix.cuda }}
      - name: Build
        run: |
          CUDA_HOME=/usr/local/cuda-$(echo ${{ matrix.cuda }} | tr - .)
          make gpu NVCC=$CUDA_HOME/bin/nvcc CUDA_HOME=$CUDA_HOME CUDA_ARCH=sm_89 EXTRA=-Werror \
            NVCC_EXTRA="-Werror all-warnings -Xcompiler -Werror"
