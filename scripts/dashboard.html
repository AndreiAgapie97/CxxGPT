<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CxxGPT training</title>
<!-- Served by scripts/dashboard.py, which reads the run's files; this page
     only draws what /api/run returns, every 10 s. No libraries: the charts
     are plain SVG. -->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085;
  --line: #dde1e8; --grid: #eceff3;
  --c1: #2f6fde; --c2: #d9622b; --c3: #2a9d6a; --c4: #8a55d6;
  --good: #1f8a5b; --warn: #b7791f; --bad: #c53030; --info: #2f6fde;
  --warn-bg: #fdf3e1; --bad-bg: #fde8e8; --info-bg: #e8f0fd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b1f27; --text: #e4e7ed; --muted: #959db0;
    --line: #2c323d; --grid: #242a33;
    --c1: #6b9cf0; --c2: #f08a57; --c3: #4cc490; --c4: #b18af0;
    --good: #4cc490; --warn: #e5b350; --bad: #f07070; --info: #6b9cf0;
    --warn-bg: #3a2f16; --bad-bg: #3d1e1e; --info-bg: #1c2a42;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
select { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 100%; }
.pill { padding: 2px 10px; border-radius: 99px; font-weight: 600; font-size: 13px; }
.pill.training { background: var(--info-bg); color: var(--info); }
.pill.ended { background: var(--grid); color: var(--muted); }
.pill.stalled, .pill.crashed, .pill.no.log { background: var(--bad-bg); color: var(--bad); }
.muted { color: var(--muted); }
main { padding: 16px; max-width: 1400px; margin: 0 auto; display: grid; gap: 16px; }
.alerts { display: grid; gap: 6px; }
.alert { padding: 8px 12px; border-radius: 6px; border-left: 4px solid; }
.alert.bad { background: var(--bad-bg); border-color: var(--bad); }
.alert.warn { background: var(--warn-bg); border-color: var(--warn); }
.alert.info { background: var(--info-bg); border-color: var(--info); }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.card { padding: 10px 12px; }
.card .label { color: var(--muted); font-size: 12px; }
.card .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--grid); border-radius: 2px; margin-top: 6px; }
.bar div { height: 100%; background: var(--c1); border-radius: 2px; }
.charts { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.panel { padding: 10px 12px; min-width: 0; }
.panel h2 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
svg.chart { width: 100%; height: 190px; display: block; touch-action: pan-y; }
svg.chart text { fill: var(--muted); font-size: 10px; }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.15); font-variant-numeric: tabular-nums; z-index: 5; }
.two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
table.heat { border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
table.heat td, table.heat th { padding: 2px 5px; text-align: right; }
table.heat th { color: var(--muted); font-weight: 500; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, Consolas, monospace; }
.scroll { max-height: 320px; overflow: auto; }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 12px; }
dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
.events div { font-size: 12px; padding: 1px 0; }
.events .k { display: inline-block; min-width: 42px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>CxxGPT training</h1>
  <label>run <select id="run"></select></label>
  <label>compare with <select id="vs"><option value="">none</option></select></label>
  <span id="state" class="pill">…</span>
  <span id="updated" class="muted"></span>
</header>
<main>
  <div id="alerts" class="alerts"></div>
  <div id="cards" class="cards"></div>
  <div id="charts" class="charts"></div>
  <div class="two">
    <div class="panel"><h2>Last wrong exam answer</h2><div id="wrong" class="scroll"></div></div>
    <div class="panel"><h2>Expert shares, last interval <span id="loadstep" class="muted"></span></h2>
      <div id="heat" class="scroll"></div></div>
  </div>
  <div class="two">
    <div class="panel"><h2>Events</h2><div id="events" class="events scroll"></div></div>
    <div class="panel"><h2>Settings</h2><div id="meta"></div></div>
  </div>
  <div class="panel"><h2>Log, last lines</h2><pre id="tail" class="scroll"></pre></div>
</main>
<div id="tip" class="tip"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const POLL_MS = 10000;
let current = null, compare = null;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
}
function fmt(v, digits = 3) {
  if (v === null || v === undefined) return "–";
  if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString("en-US");
  if (v !== 0 && Math.abs(v) < 0.01) return v.toExponential(2);
  return (+v.toPrecision(digits)).toString();
}
function duration(s) {
  if (s === null || s === undefined) return "–";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${m} min` : m ? `${m} min` : `${s} s`;
}
function clock(t) {
  return new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// Round numbers between lo and hi for the axes: steps of 1, 2 or 5 x 10^k.
function ticks(lo, hi, n = 4) {
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * p).find(s => s >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}

// A line chart: series = [{name, color, points: [[x, y], ...], dashed, dots}].
function chart(title, series, opts = {}) {
  const panel = document.createElement("div");
  panel.className = "panel";
  series = series.filter(s => s.points.length);
  const legend = series.map(s =>
    `<span><i style="background:${s.color}${s.dashed ? ";opacity:.55" : ""}"></i>${esc(s.name)}</span>`).join("");
  panel.innerHTML = `<h2>${esc(title)}</h2><div class="legend">${legend}</div>`;
  const W = 600, H = 190, L = 46, R = 8, T = 8, B = 20;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.classList.add("chart");
  panel.appendChild(svg);
  const all = series.flatMap(s => s.points);
  if (!all.length) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">no data yet</text>`;
    return panel;
  }
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let ys = all.map(p => p[1]);
  if (opts.robust && ys.length > 20) {  // a spike at the start must not flatten the rest
    const sorted = [...ys].sort((a, b) => a - b);
    ys = [sorted[0], sorted[Math.floor(sorted.length * 0.98)]];
  }
  let y0 = opts.zero ? 0 : Math.min(...ys), y1 = Math.max(...ys);
  if (opts.max !== undefined) y1 = Math.max(y1, opts.max);
  if (y1 === y0) { y1 += 1; y0 -= opts.zero ? 0 : 1; }
  const pad = (y1 - y0) * 0.06; y1 += pad; if (!opts.zero) y0 -= pad;
  if (x1 === x0) x1 = x0 + 1;
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const sy = y => T + (1 - (Math.min(Math.max(y, y0), y1) - y0) / (y1 - y0)) * (H - T - B);
  const xfmt = opts.time ? clock : v => fmt(v);
  let g = "";
  for (const y of ticks(y0, y1)) {
    const py = sy(y);
    g += `<line x1="${L}" x2="${W - R}" y1="${py}" y2="${py}" stroke="${css("--grid")}"/>`;
    g += `<text x="${L - 4}" y="${py + 3}" text-anchor="end">${fmt(y)}</text>`;
  }
  const xs = opts.time ? [0, 1, 2, 3, 4].map(i => x0 + (x1 - x0) * i / 4) : ticks(x0, x1);
  for (const x of xs)
    g += `<text x="${sx(x)}" y="${H - 5}" text-anchor="middle">${xfmt(x)}</text>`;
  for (const m of opts.marks || []) {
    if (m >= x0 && m <= x1)
      g += `<line x1="${sx(m)}" x2="${sx(m)}" y1="${T}" y2="${H - B}" stroke="${css("--muted")}" stroke-dasharray="2 3"/>`;
  }
  for (const s of series) {
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.6" vector-effect="non-scaling-stroke"` +
         `${s.dashed ? ' stroke-dasharray="5 4" opacity=".6"' : ""}/>`;
    if (s.dots || s.points.length < 3)
      for (const p of s.points) g += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="2.2" fill="${s.color}"/>`;
  }
  g += `<line class="cursor" y1="${T}" y2="${H - B}" stroke="${css("--muted")}" visibility="hidden"/>`;
  svg.innerHTML = g;
  const cursor = svg.querySelector(".cursor"), tip = $("tip");
  svg.addEventListener("pointermove", ev => {
    const box = svg.getBoundingClientRect();
    const x = x0 + ((ev.clientX - box.left) / box.width * W - L) / (W - L - R) * (x1 - x0);
    const rows = series.map(s => {
      let best = null;
      for (const p of s.points) if (!best || Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p;
      return best && `<span style="color:${s.color}">${esc(s.name)}</span> ${fmt(best[1], 4)}` +
        ` <span class="muted">@ ${xfmt(best[0])}</span>`;
    }).filter(Boolean);
    cursor.setAttribute("x1", sx(Math.min(Math.max(x, x0), x1)));
    cursor.setAttribute("x2", sx(Math.min(Math.max(x, x0), x1)));
    cursor.setAttribute("visibility", "visible");
    tip.innerHTML = rows.join("<br>");
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (ev.clientY + 12) + "px";
  });
  svg.addEventListener("pointerleave", () => { cursor.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  return panel;
}

const pts = (rows, key, xkey = "step") =>
  rows.filter(r => r[key] !== null && r[key] !== undefined).map(r => [r[xkey], r[key]]);

function card(label, value, sub = "", progress = null) {
  return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${value}</div>` +
    `<div class="sub">${sub}</div>${progress === null ? "" :
    `<div class="bar"><div style="width:${Math.min(100, progress * 100).toFixed(1)}%"></div></div>`}</div>`;
}

function render() {
  const r = current, s = r.summary, vs = compare;
  const state = $("state");
  state.textContent = s.state;
  state.className = "pill " + s.state;
  $("updated").textContent = s.log_age === null ? "" : `last log line ${duration(s.log_age)} ago`;
  document.title = `${r.name}: ${s.state} · step ${s.last_step ?? "–"}`;

  $("alerts").innerHTML = s.alerts.map(a => `<div class="alert ${a.level}">${esc(a.text)}</div>`).join("");

  const ex = s.exam, best = s.best_exam, g = s.gpu;
  $("cards").innerHTML = [
    card("Step", s.last_step === null ? "–" : s.last_step.toLocaleString("en-US"),
      s.total_steps ? `of ${s.total_steps.toLocaleString("en-US")}` : "",
      s.total_steps && s.last_step !== null ? s.last_step / s.total_steps : null),
    card("Time left", s.state === "training" ? duration(s.eta_seconds) : "–",
      s.minutes ? `time limit ${duration(s.minutes * 60)}` : ""),
    card("Speed", s.tok_per_s === null ? "–" : `${fmt(s.tok_per_s)} <span class="sub">tok/s</span>`,
      s.ms_per_step ? `${fmt(s.ms_per_step)} ms a step` : ""),
    card("Training loss", fmt(s.loss, 4), "mean of the last log interval"),
    card("Validation loss", fmt(s.val_loss, 4),
      s.best_val ? `best ${fmt(s.best_val[1], 4)} at step ${s.best_val[0]}` : ""),
    card("GSM8K exam", ex ? `${ex.percent}%` : "–",
      ex ? `${ex.correct} / ${ex.total} at step ${ex.step} (${esc(ex.effort)})` +
           (best ? `<br>best ${best.percent}% at step ${best.step}` : "") : ""),
    card("GPU", g ? `${fmt(g.temp)} °C` : "–", g ? `${fmt(g.power)} W · ${fmt(g.clock)} MHz · ${fmt(g.mem)} MiB` : "no recent sample"),
  ].join("");

  const C = [css("--c1"), css("--c2"), css("--c3"), css("--c4")];
  const other = (key, src = "rows", xkey = "step") => vs ? pts(vs[src], key, xkey) : [];
  const vsName = vs ? ` (${vs.name})` : "";
  const exams = rr => rr.exams.map(e => [e.step, e.percent]);
  const charts = $("charts");
  charts.innerHTML = "";
  const marks = r.resumes;
  charts.append(
    chart("Loss", [
      {name: "training", color: C[0], points: pts(r.rows, "loss")},
      {name: "validation", color: C[1], points: pts(r.rows, "val_loss"), dots: true},
      {name: "training" + vsName, color: C[0], points: other("loss"), dashed: true},
      {name: "validation" + vsName, color: C[1], points: other("val_loss"), dashed: true},
    ], {robust: true, marks}),
    chart("GSM8K exam, % correct", [
      {name: r.name, color: C[2], points: exams(r), dots: true},
      {name: vs ? vs.name : "", color: C[2], points: vs ? exams(vs) : [], dashed: true},
    ], {zero: true, marks}),
  );
  // train --val-sources: each held-out file on its own (a Q&A file's
  // answers), and the final answers (after ####) of the Q&A files.
  const vsrc = r.val_sources || {}, names = Object.keys(vsrc);
  const palette = [C[0], C[1], C[2], C[3], css("--warn"), css("--muted")];
  const color = n => palette[names.indexOf(n) % palette.length];
  if (names.length) {
    charts.append(chart("Validation loss by source (Q&A files: their answers)", names.map(n => {
      const p = vsrc[n].answers || vsrc[n].text || [];
      return {name: n, color: color(n), points: p, dots: p.length < 30};
    }), {marks}));
    const finals = names.filter(n => vsrc[n].final);
    if (finals.length)
      charts.append(chart("Final answers' loss (the tokens after ####)", finals.map(n =>
        ({name: n, color: color(n), points: vsrc[n].final, dots: vsrc[n].final.length < 30})), {marks}));
  }
  charts.append(
    chart("Learning rate", [{name: "lr", color: C[3], points: pts(r.rows, "lr")}], {zero: true, marks}),
    chart("Gradient norm", [
      {name: "before clipping", color: C[0], points: pts(r.rows, "grad_norm")},
      {name: "gnorm" + vsName, color: C[0], points: other("grad_norm"), dashed: true},
    ], {robust: true, zero: true, marks}),
    chart("Speed, tokens a second", [
      {name: "tok/s", color: C[2], points: r.speed.map(p => [p[0], p[1]])},
      {name: "tok/s" + vsName, color: C[2], points: vs ? vs.speed.map(p => [p[0], p[1]]) : [], dashed: true},
    ], {zero: true, marks}),
    chart("Experts: the smallest share in any layer, %", [
      {name: "smallest", color: C[1], points: r.load_lowest.map(p => [p[0], 100 * p[1]])},
    ], {zero: true, marks}),
    chart("GPU temperature °C and power W (clock time)", [
      {name: "°C", color: C[1], points: r.gpu.map(p => [p.t, p.temp])},
      {name: "W", color: C[0], points: r.gpu.map(p => [p.t, p.power])},
    ], {time: true, zero: true}),
  );
  for (const extra of r.columns.filter(c => !["step", "loss", "val_loss", "lr", "grad_norm", "ms_per_step", "load_ratio"].includes(c)))
    charts.append(chart(extra.replaceAll("_", " "), [{name: extra, color: C[3], points: pts(r.rows, extra)}], {marks}));

  const w = r.last_wrong;
  $("wrong").innerHTML = w ? `<dl><dt>step</dt><dd>${w.step ?? "–"} (${esc(w.task)})</dd>` +
    `<dt>question</dt><dd>${esc(w.question)}</dd></dl>` +
    `<h2 style="margin-top:8px">expected</h2><pre>${esc(w.expected)}</pre>` +
    `<h2 style="margin-top:8px">the model wrote</h2><pre>${esc(w.got)}</pre>` : `<span class="muted">no exam yet</span>`;

  const L = r.load_last;
  if (L) {
    const E = L.layers[0].length, even = 1 / E;
    $("loadstep").textContent = `(step ${L.step}; even is ${(100 * even).toFixed(1)}%)`;
    let h = `<table class="heat"><tr><th>layer</th>${L.layers[0].map((_, e) => `<th>e${e}</th>`).join("")}</tr>`;
    L.layers.forEach((row, li) => {
      h += `<tr><th>${li}</th>` + row.map(v => {
        const t = Math.min(1, Math.abs(v - even) / even);   // 0: even, 1: twice or nothing
        const color = v < 0.01 ? css("--bad") : v > even ? css("--c1") : css("--c2");
        return `<td style="background:color-mix(in srgb, ${color} ${Math.round(10 + 50 * t)}%, transparent)">${(100 * v).toFixed(1)}</td>`;
      }).join("") + "</tr>";
    });
    $("heat").innerHTML = h + "</table>";
  } else {
    $("loadstep").textContent = "";
    $("heat").innerHTML = `<span class="muted">no expert log (a dense model, or none written yet)</span>`;
  }

  $("events").innerHTML = r.events.slice().reverse().map(e =>
    `<div><span class="k">${esc(e.kind)}</span> ${e.step !== null ? `<span class="muted">@${e.step}</span> ` : ""}${esc(e.text)}</div>`
  ).join("") || `<span class="muted">none</span>`;
  $("meta").innerHTML = "<dl>" + Object.entries(r.meta).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") + "</dl>";
  const tail = $("tail"), atEnd = tail.scrollTop + tail.clientHeight >= tail.scrollHeight - 4;
  tail.textContent = r.tail.join("\n");
  if (atEnd) tail.scrollTop = tail.scrollHeight;
}

async function get(name) {
  const res = await fetch("/api/run?name=" + encodeURIComponent(name));
  if (!res.ok) throw new Error(`${name}: ${res.status}`);
  return res.json();
}

async function refresh() {
  const name = $("run").value, vsName = $("vs").value;
  try {
    current = await get(name);
    compare = vsName && vsName !== name ? await get(vsName) : null;
    render();
  } catch (e) {
    $("updated").textContent = "the dashboard server does not answer (" + e.message + ")";
    $("state").textContent = "?";
  }
}

async function start() {
  const runs = await (await fetch("/api/runs")).json();
  const want = new URLSearchParams(location.search);
  for (const sel of ["run", "vs"])
    for (const n of runs) $(sel).insertAdjacentHTML("beforeend", `<option>${esc(n)}</option>`);
  if (want.get("run") && runs.includes(want.get("run"))) $("run").value = want.get("run");
  if (want.get("vs") && runs.includes(want.get("vs"))) $("vs").value = want.get("vs");
  for (const sel of ["run", "vs"])
    $(sel).addEventListener("change", () => {
      const q = new URLSearchParams({run: $("run").value});
      if ($("vs").value) q.set("vs", $("vs").value);
      history.replaceState(null, "", "?" + q);
      refresh();
    });
  if (!runs.length) { $("updated").textContent = "no runs in runs/ yet"; return; }
  await refresh();
  setInterval(refresh, POLL_MS);
}
start();
</script>
</body>
</html>
